  <style>
    :root{
      --background:#080808;
      --text:#f5f5f5;
      --muted:#999999;
      --border:#292929;
      --content-width:1100px;
      --header-height:76px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%; background:var(--background); color:var(--text); font-family:"DM Sans",system-ui, -apple-system, "Segoe UI", Roboto, Arial}
    .container{width:min(var(--content-width), calc(100% - 64px)); margin:0 auto}
    .site-header{ position:fixed; top:0; left:0; right:0; height:var(--header-height); display:flex; align-items:center; background:rgba(8,8,8,0.88); backdrop-filter: blur(8px); border-bottom:1px solid var(--border); z-index:100;}
    .header-inner{width:min(var(--content-width), calc(100% - 64px)); margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:0 0;}
    .logo{font-family:"Playfair Display", serif; font-weight:700; font-size:20px; text-decoration:none; color:var(--text)}
    .nav a{color:var(--muted); margin-left:18px; text-decoration:none; font-size:14px}
    .nav a:hover{color:var(--text)}
    main{padding-top:var(--header-height);}

    .page-head{padding:80px 0 20px; text-align:center}
    h1{font-family:"Playfair Display",serif; font-size:34px; margin-bottom:8px}
    p.lead{color:var(--muted); margin-bottom:18px}

    /* Goodreads widget styles (from your snippet with slight layout adaption) */
    .gr_grid_container {
      /* default grid behavior, Goodreads widget will fill this */
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 14px;
      align-items: start;
      justify-items: center;
      padding: 8px 6px;
      margin: 0 auto;
      max-width: var(--content-width);
    }

    .gr_grid_book_container {
      float: none;
      width: 98px;
      height: 160px;
      padding: 0;
      overflow: hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .gr_grid_book_container img { width:100%; height:auto; display:block; border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,0.45); transition: transform .18s ease, box-shadow .18s ease; }
    .gr_grid_book_container a:hover img { transform: translateY(-6px) scale(1.02); box-shadow:0 12px 28px rgba(0,0,0,0.55); }

    .noscript-note{color:var(--muted); margin-top:12px; text-align:center}

    footer{padding:60px 0; text-align:center; color:var(--muted); font-size:13px}
    @media (max-width:700px){
      .gr_grid_book_container{ width:86px; height:140px; }
    }
  </style>
</head>
